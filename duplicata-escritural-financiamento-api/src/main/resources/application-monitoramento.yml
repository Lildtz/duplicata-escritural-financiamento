server:
  address: 127.0.0.1

financiamento:
  monitoramento:
    usuario: ${FINANCIAMENTO_METRICAS_USUARIO:}
    senha-hash: ${FINANCIAMENTO_METRICAS_SENHA_HASH:}

management:
  endpoint:
    prometheus:
      access: read-only
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

spring:
  application:
    name: duplicata-escritural-financiamento-api

server:
  port: 8080

management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    propagation:
      type: w3c
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: ${spring.application.name}
      exclude: stack_trace

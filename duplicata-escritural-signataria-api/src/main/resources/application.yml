spring:
  application:
    name: duplicata-escritural-signataria-api
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
  datasource:
    url: jdbc:postgresql://${ESCRITURADORA_DB_HOST:localhost}:${ESCRITURADORA_DB_PORT:5432}/${ESCRITURADORA_DB_NAME:escrituradora}
    username: ${ESCRITURADORA_DB_USERNAME:escrituradora}
    password: ${ESCRITURADORA_DB_PASSWORD:escrituradora_local}
  flyway:
    schemas: escrituradora
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: escrituradora

server:
  port: 8081

signataria:
  escrituracao:
    processamento:
      habilitado: false
      polling: 1s
      maximo-tentativas: 3
      espera-segunda-tentativa: 5s
      espera-terceira-tentativa: 30s
      duracao-reserva: 60s
      timeout-execucao: 10s

management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    propagation:
      type: w3c
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    enabled: false
    version: OPENAPI_3_0
  swagger-ui:
    enabled: false
  paths-to-match: /api/v1/**
  show-actuator: false
  override-with-generic-response: false

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: ${spring.application.name}
      exclude: stack_trace

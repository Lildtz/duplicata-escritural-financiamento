name: duplicata-monitoramento

services:
  prometheus:
    image: prom/prometheus:v3.13.5
    user: "65534:65534"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    secrets:
      - financiamento_usuario
      - financiamento_senha
      - signataria_usuario
      - signataria_senha
    networks:
      - monitoramento

  grafana:
    image: grafana/grafana:13.3.1
    user: "472:472"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    entrypoint:
      - /bin/sh
      - -ec
      - test -f /run/secrets/grafana_admin_senha && grep -q '[^[:space:]]' /run/secrets/grafana_admin_senha && exec /run.sh
    environment:
      GF_SECURITY_ADMIN_USER: operador-grafana
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_senha
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    tmpfs:
      - /tmp
    secrets:
      - grafana_admin_senha
    networks:
      - monitoramento

secrets:
  financiamento_usuario:
    file: ./.env.monitoramento/financiamento.usuario
  financiamento_senha:
    file: ./.env.monitoramento/financiamento.senha
  signataria_usuario:
    file: ./.env.monitoramento/signataria.usuario
  signataria_senha:
    file: ./.env.monitoramento/signataria.senha
  grafana_admin_senha:
    file: ./.env.monitoramento/grafana-admin.senha

networks:
  monitoramento:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:

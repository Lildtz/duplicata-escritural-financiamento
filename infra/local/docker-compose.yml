services:
  postgres-escrituradora:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${ESCRITURADORA_DB_NAME:-escrituradora}
      POSTGRES_USER: ${ESCRITURADORA_DB_USERNAME:-escrituradora}
      POSTGRES_PASSWORD: ${ESCRITURADORA_DB_PASSWORD:-escrituradora_local}
    ports:
      - "${ESCRITURADORA_DB_PORT:-5432}:5432"
    volumes:
      - postgres-escrituradora-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-escrituradora-data:
